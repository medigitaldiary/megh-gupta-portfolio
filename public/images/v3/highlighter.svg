<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" preserveAspectRatio="none">
  <!-- Chisel-tipped horizontal stroke with FLAT fill (no gradient,
       no darker start blob, no secondary darker patch). Opacity is
       uniform across the whole stroke. -->
  <path
    d="M 6 14 Q 2 50 6 86 L 272 92 L 294 50 L 272 8 Z"
    fill="#CBB3E8"
    opacity="0.6"
  />

  <!-- Four faint grain streaks running along the stroke to retain
       a hand-drawn feel — same opacity along their full length so
       nothing fades. -->
  <line x1="22" y1="26" x2="268" y2="28" stroke="#B89CDC" stroke-width="1" stroke-linecap="round" opacity="0.35" />
  <line x1="22" y1="42" x2="275" y2="40" stroke="#B89CDC" stroke-width="0.8" stroke-linecap="round" opacity="0.28" />
  <line x1="22" y1="58" x2="272" y2="60" stroke="#B89CDC" stroke-width="0.8" stroke-linecap="round" opacity="0.28" />
  <line x1="22" y1="74" x2="265" y2="72" stroke="#B89CDC" stroke-width="1" stroke-linecap="round" opacity="0.35" />
</svg>
