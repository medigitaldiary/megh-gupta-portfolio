<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" preserveAspectRatio="none">
  <defs>
    <linearGradient id="hl-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9B7FC9" stop-opacity="0.95"/>
      <stop offset="0.06" stop-color="#A890D4" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#CBB3E8" stop-opacity="0.72"/>
      <stop offset="0.75" stop-color="#CBB3E8" stop-opacity="0.68"/>
      <stop offset="0.97" stop-color="#CBB3E8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#CBB3E8" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Dark starting blob where the pen first hits the paper -->
  <ellipse cx="14" cy="50" rx="11" ry="36" fill="#8769B8" opacity="0.75" />

  <!-- Main broad body with chisel ends (angled right edge) -->
  <path
    d="M 6 14 Q 2 50 6 86 L 272 92 L 294 50 L 272 8 Z"
    fill="url(#hl-body)"
  />

  <!-- Faint grain streaks running along the stroke -->
  <line x1="22" y1="26" x2="268" y2="28" stroke="#CBB3E8" stroke-width="1" stroke-linecap="round" opacity="0.4" />
  <line x1="22" y1="42" x2="275" y2="40" stroke="#CBB3E8" stroke-width="0.7" stroke-linecap="round" opacity="0.3" />
  <line x1="22" y1="58" x2="272" y2="60" stroke="#CBB3E8" stroke-width="0.7" stroke-linecap="round" opacity="0.28" />
  <line x1="22" y1="74" x2="265" y2="72" stroke="#CBB3E8" stroke-width="1" stroke-linecap="round" opacity="0.38" />

  <!-- A hint of a second-pass darker streak near the start, like the pen pressed harder initially -->
  <path
    d="M 10 32 Q 60 30 110 34 L 108 66 Q 60 68 10 64 Z"
    fill="#B89CDC"
    opacity="0.18"
  />
</svg>
